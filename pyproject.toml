# Tool config only. Dependencies live in requirements*.txt (simple for Docker + Cloud Build).
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # so `pytest` (not just `python -m pytest`) can import api.*
addopts = "-q"
